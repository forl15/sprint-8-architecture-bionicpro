server.port=8000
spring.application.name=bionicpro-reports

spring.datasource.url=${CLICKHOUSE_URL:jdbc:clickhouse://clickhouse:8123}
spring.datasource.username=${CLICKHOUSE_USER:default}
spring.datasource.password=${CLICKHOUSE_PASSWORD:clickhouse}
spring.datasource.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver

keycloak.jwks-uri=${KEYCLOAK_JWKS_URI:http://keycloak:8080/realms/reports-realm/protocol/openid-connect/certs}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
